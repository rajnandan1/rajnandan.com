<style>
    /* rajnandan.com · design system: Kami (紙)
     * Warm parchment canvas · one ink-blue accent · serif carries hierarchy ·
     * warm neutrals only · flat surfaces · subtractive lines.
     * Canonical spec: design.md · portable token copy: tokens.css
     * Implementation: token block on `body` / `body.dark`, mapped onto the
     * Serene theme's variable API. */

    /* ─── tokens · day edition ─────────────────────────────────────── */

    body {
        --color-bg: #f5f4ed; /* parchment  · page ground, never white */
        --color-surface: #faf9f5; /* ivory      · quiet filled container */
        --color-code-bg: #f0eee6; /* one warm step darker than parchment */
        --color-control: #e8e6dc; /* warm sand  · interactive surface */

        --color-text: #141413; /* near black · primary */
        --color-text-2: #3d3d3a; /* dark warm  · secondary */
        --color-text-3: #504e49; /* olive      · subtext, ledes */
        --color-text-4: #6b6a64; /* stone      · metadata */

        --color-border: #e8e6dc;
        --color-border-soft: #e5e3d8;

        --color-brand: #1b365d; /* ink blue · the only chromatic colour */
        --color-brand-hover: #2d5a8a;
        --color-brand-tint: #eef2f7;
        --color-tag-bg: #e4ecf5;

        --color-warn: #8b4513; /* the one sanctioned warm accent */
        --color-warn-bg: #f0e0d8;

        /* code surface — a dark block on parchment, Kami's screen pattern */
        --code-surface: #141318;
        --code-fg: #d4d1c8;
        --code-faint: #948e80; /* Kami's #79756a reads under 4:1 on the block */
        --code-rule: #2a2a2e;
        --code-mark: #26303f;
        --code-keyword: #84aad6;
        --code-string: #8cbb91;
        --code-number: #cbab86;
        --code-function: #d6c78c;
        --code-builtin: #b59ccd;
        --code-deleted: #c08a7d;

        /* type — one serif for headings and body; ui sans is chrome only */
        --font-serif:
            "Source Serif 4", Charter, Georgia, Palatino, "Times New Roman",
            serif;
        --font-ui:
            system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
        --font-mono:
            "JetBrains Mono", "SF Mono", "Fira Code", Consolas, Monaco,
            monospace;

        --text-label: 12px; /* uppercase overlines only */
        --text-meta: 13px;
        --text-small: 14px;
        --text-ui: 15px;
        --text-body: 18px;
        --text-lede: 21px;
        --text-h3: 22px;
        --text-h2: 30px;
        --text-h1: clamp(30px, 5vw, 36px);
        --text-display: clamp(30px, 6vw, 56px);

        /* space — 4px base */
        --space-xs: 4px;
        --space-sm: 8px;
        --space-md: 16px;
        --space-lg: 24px;
        --space-xl: 40px;
        --space-2xl: 64px;
        --space-3xl: 96px;

        --radius-sm: 2px;
        --radius-md: 4px;
        --radius-lg: 8px;
        --radius-pill: 999px;

        --dur: 150ms;

        /* ─── Serene theme API, mapped onto the tokens ─────────────── */

        --primary-color: var(--color-brand);
        --primary-pale-color: var(--color-border);
        --primary-decoration-color: transparent;
        --bg-color: var(--color-bg);
        --text-color: var(--color-text);
        --text-pale-color: var(--color-text-4);
        --text-decoration-color: var(--color-border);
        --highlight-mark-color: var(--color-tag-bg);

        --callout-note-color: var(--color-brand);
        --callout-tip-color: var(--color-brand);
        --callout-important-color: var(--color-brand);
        --callout-warning-color: var(--color-warn);
        --callout-caution-color: var(--color-warn);

        --inline-code-bg-color: var(--color-code-bg);
        --inline-code-border-radius: var(--radius-sm);
        --block-code-border-color: transparent;
        --block-code-border-radius: var(--radius-lg);
        --detail-border-color: var(--color-border);
        --detail-border-radius: var(--radius-lg);

        --main-font: var(--font-serif);
        --code-font: var(--font-mono);
        --homepage-max-width: 760px;
        --main-max-width: 720px;
        --avatar-size: 56px;
        --font-size: var(--text-body);
        --line-height: 1.55;
        --img-border-radius: var(--radius-lg);
        --dark-mode-img-brightness: 0.88;
        --dark-mode-chart-brightness: 0.92;

        font-kerning: normal;
        font-optical-sizing: auto;
        font-synthesis-weight: none;
        font-feature-settings: "liga", "kern", "calt";
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
    }

    /* ─── tokens · night edition ───────────────────────────────────── */

    body.dark {
        --color-bg: #141413; /* deep dark · warm, not black */
        --color-surface: #1c1b19;
        --color-code-bg: #23221f;
        --color-control: #30302e;

        --color-text: #faf9f5;
        --color-text-2: #d4d1c8;
        --color-text-3: #b0aea5;
        --color-text-4: #8f8d85;

        --color-border: #302f2b;
        --color-border-soft: #262521;

        /* ink blue lifted to clear 4.5:1 on the deep-dark ground —
         * Kami's #2D5A8A reaches only 2.6:1 there. See design.md. */
        --color-brand: #7fa6ce;
        --color-brand-hover: #a3c1e0;
        --color-brand-tint: #1e2a38;
        --color-tag-bg: #1e2a38;

        --color-warn: #d9a273;
        --color-warn-bg: #2c231c;

        /* the page is already darker than the light-mode code block, so the
         * block steps up instead of down or it stops reading as a container */
        --code-surface: #23221f;
        --code-rule: #35332e;

        /* headings stay ivory; running text steps down one level so long
         * reading does not glare — Kami's dark-section treatment */
        --text-color: var(--color-text-2);
    }

    /* ─── base ─────────────────────────────────────────────────────── */

    html {
        scroll-behavior: smooth;
        overflow-x: clip;
    }

    body {
        overflow-x: clip;
        accent-color: var(--color-brand);
        letter-spacing: 0;
    }

    body ::selection {
        color: var(--color-text);
        background: var(--color-tag-bg);
    }

    body :is(a, button) {
        transition:
            color var(--dur) ease,
            background-color var(--dur) ease,
            border-color var(--dur) ease,
            text-decoration-color var(--dur) ease;
    }

    body :is(a, button):focus-visible {
        outline: 2px solid var(--color-brand);
        outline-offset: 3px;
        border-radius: var(--radius-sm);
    }

    body button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
    }

    /* numbers keep one height and one width everywhere */
    body :is(.date, #date, time, td, .metric) {
        font-variant-numeric: lining-nums tabular-nums;
    }

    /* ─── chrome · overlines, nav, back link ───────────────────────── */

    body :is(header a, .layout-list .category, .read-more a) {
        font-family: var(--font-ui);
        font-size: var(--text-label);
        font-weight: 500;
        letter-spacing: 0.4px;
        text-transform: uppercase;
        color: var(--color-text-4);
        text-decoration: none;
        white-space: nowrap;
    }

    @media (hover: hover) {
        body :is(header a, .read-more a):hover {
            color: var(--color-brand-hover);
        }
    }

    body :is(header a, .read-more a):focus-visible {
        color: var(--color-brand-hover);
    }

    /* an action, not an overline: brand carries the "clickable" contract.
     * Stated here rather than left to Serene's own selector winning. */
    body .layout-list .read-more a {
        color: var(--color-brand);
    }

    /* ─── section head · blog, projects, books, contact, support ───── */

    /* margin, not padding, so the closing rule lines up with the rows below
     * instead of running 15px wider on each side */
    body .section-title {
        margin: 0 15px var(--space-lg);
        padding: 0 0 var(--space-md);
        border-bottom: 1px solid var(--color-border);
    }

    body .section-title h1 {
        font-family: var(--font-serif);
        font-weight: 500;
        font-size: var(--text-h1);
        line-height: 1.2;
        letter-spacing: 0;
        margin: var(--space-lg) 0 0;
        text-wrap: balance;
        overflow-wrap: break-word;
        min-width: 0;
    }

    body .section-title p {
        max-width: 62ch;
        margin: var(--space-sm) 0 0;
        font-size: var(--text-ui);
        line-height: 1.55;
        color: var(--color-text-3);
    }

    /* ─── homepage · Kami hero ─────────────────────────────────────── */

    body.homepage #wrapper main {
        display: flex;
        flex-direction: column;
        min-height: auto;
        padding: var(--space-3xl) 0 var(--space-xl);
    }

    /* flex children default to min-width:auto and refuse to shrink below
     * their content, which pushes the page wider than the viewport */
    body.homepage #wrapper main > section,
    body.homepage #wrapper #info #text,
    body.homepage #wrapper #links > div {
        min-width: 0;
    }

    /* eyebrow row first, then the name — Kami hero order */
    body.homepage #wrapper #links {
        order: 1;
        margin: 0 0 var(--space-2xl);
        gap: var(--space-md);
    }

    /* the hero stacks: mark, then the name, then the title — so the display
     * line always gets the full measure instead of sharing it with the mark */
    body.homepage #wrapper #info {
        order: 2;
        flex-direction: column;
        align-items: flex-start;
        gap: var(--space-md);
    }

    body.homepage #wrapper #brief {
        order: 3;
        max-width: 66ch;
        margin-top: var(--space-lg);
        padding-bottom: var(--space-xl);
        border-bottom: 1px solid var(--color-border-soft);
    }

    body.homepage #wrapper .layout-list {
        order: 4;
        margin-top: var(--space-xl);
    }

    body.homepage #wrapper #info img {
        height: var(--avatar-size);
        width: var(--avatar-size);
        border-radius: var(--radius-lg);
        object-fit: cover;
        background: var(--color-surface);
    }

    body.homepage #wrapper #info #text {
        gap: var(--space-sm);
    }

    body.homepage #wrapper #name {
        font-family: var(--font-serif);
        font-weight: 500;
        font-size: var(--text-display);
        line-height: 1.1;
        letter-spacing: 0;
        color: var(--color-text);
        text-wrap: balance;
        overflow-wrap: break-word;
        min-width: 0;
    }

    body.homepage #wrapper #bio {
        font-size: var(--text-lede);
        line-height: 1.5;
        letter-spacing: 0.2px;
        color: var(--color-text-3);
        text-transform: none;
        max-width: 62ch;
    }

    /* nav row: uppercase ui labels left, icon links right */
    body.homepage #wrapper #links #left {
        gap: var(--space-lg);
        flex-wrap: wrap;
    }

    body.homepage #wrapper #links #left a {
        font-family: var(--font-ui);
        font-size: var(--text-label);
        font-weight: 500;
        letter-spacing: 0.4px;
        text-transform: uppercase;
        color: var(--color-text-4);
        text-decoration: none;
        border-bottom: 0;
        white-space: nowrap;
    }

    body.homepage #wrapper #links #right {
        gap: var(--space-sm);
    }

    body.homepage #wrapper #links :is(a, button) {
        color: var(--color-text-4);
    }

    @media (hover: hover) {
        body.homepage #wrapper #links :is(a, button):hover {
            color: var(--color-brand);
            background: none;
        }
    }

    body.homepage #wrapper #links :is(a, button):focus-visible {
        color: var(--color-brand);
    }

    body.homepage #wrapper #brief p:first-of-type {
        font-size: var(--text-lede);
        line-height: 1.5;
        color: var(--color-text-2);
    }

    /* ─── writing index ────────────────────────────────────────────── */

    body.homepage #wrapper .layout-list .post-list::before {
        content: "Recent writing";
        display: block;
        font-family: var(--font-ui);
        font-size: var(--text-label);
        font-weight: 500;
        letter-spacing: 0.4px;
        text-transform: uppercase;
        color: var(--color-text-4);
        margin-bottom: var(--space-md);
    }

    body .layout-list .category {
        margin: var(--space-xl) 15px var(--space-md);
    }

    body .layout-list .post {
        align-items: baseline;
        gap: var(--space-md);
        padding: 14px 0;
        border-bottom: 1px solid var(--color-border-soft);
        text-decoration: none;
    }

    body .layout-list .post span:first-child {
        font-family: var(--font-serif);
        font-weight: 500;
        font-size: var(--text-ui);
        line-height: 1.3;
        color: var(--color-text);
    }

    body .layout-list .post .date {
        font-family: var(--font-ui);
        font-size: var(--text-meta);
        color: var(--color-text-4);
        white-space: nowrap;
    }

    @media (hover: hover) {
        body .layout-list .post:hover {
            border-bottom-color: var(--color-border-soft);
        }

        body .layout-list .post:hover span:first-child {
            color: var(--color-brand);
        }
    }

    body .layout-list .post:focus-visible span:first-child {
        color: var(--color-brand);
    }

    /* featured is state, so it gets the tag component, not a glyph */
    body .layout-list .post.featured::before {
        content: none;
    }

    body .layout-list .post.featured span:first-child::after {
        content: "Featured" / "";
        display: inline-block;
        margin-left: var(--space-sm);
        vertical-align: 1px;
        font-family: var(--font-ui);
        font-size: var(--text-label);
        font-weight: 600;
        letter-spacing: 0.4px;
        text-transform: uppercase;
        color: var(--color-brand);
        background: var(--color-tag-bg);
        padding: 1px 6px;
        border-radius: var(--radius-md);
    }

    body .layout-list .read-more {
        margin-top: var(--space-lg);
    }

    /* ─── post page ────────────────────────────────────────────────── */

    body.post #wrapper main article.prose > h1 {
        font-family: var(--font-serif);
        font-weight: 500;
        font-size: var(--text-h1);
        line-height: 1.2;
        letter-spacing: 0;
        text-wrap: balance;
        overflow-wrap: break-word;
        min-width: 0;
    }

    body.post #wrapper main article #post-info {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        justify-content: space-between;
        gap: var(--space-sm) var(--space-md);
        padding-bottom: var(--space-md);
        margin-bottom: var(--space-xl);
        border-bottom: 1px solid var(--color-border);
        font-size: var(--text-meta);
    }

    body.post #wrapper main article #date {
        margin-bottom: 0;
        font-family: var(--font-ui);
        font-size: var(--text-meta);
        color: var(--color-text-4);
    }

    body.post #wrapper main article #tags {
        margin-bottom: 0;
        gap: var(--space-sm);
    }

    body.post #wrapper main article #tags a {
        font-family: var(--font-ui);
        font-size: var(--text-label);
        font-weight: 600;
        letter-spacing: 0.4px;
        text-transform: uppercase;
        color: var(--color-brand);
        background: var(--color-tag-bg);
        padding: 2px 7px;
        border-radius: var(--radius-md);
        border-bottom: 0;
        text-decoration: none;
        line-height: 1.5;
    }

    body.post #wrapper main article #tags a span {
        display: none;
    }

    @media (hover: hover) {
        body.post #wrapper main article #tags a:hover {
            border-bottom: 0;
            color: var(--color-brand-hover);
        }
    }

    body.post #wrapper main article #outdate_alert {
        font-style: normal;
        color: var(--color-warn);
        background: var(--color-warn-bg);
        border-radius: var(--radius-lg);
        padding: 12px var(--space-md);
        font-size: var(--text-small);
    }

    body.post .mermaid {
        background: var(--color-surface);
    }

    /* table of contents: a rail, not a fill */
    body.post #wrapper aside {
        font-size: var(--text-small);
    }

    body.post #wrapper aside nav {
        background: none;
        border-inline-start: 1px solid var(--color-border);
        padding: 0 var(--space-md) 0 var(--space-lg);
        line-height: 1.5;
    }

    body.post #wrapper aside a {
        color: var(--color-text-4);
        text-decoration: none;
    }

    @media (hover: hover) {
        body.post #wrapper aside a:hover {
            color: var(--color-brand);
        }
    }

    body.post #wrapper aside a:focus-visible {
        color: var(--color-brand);
    }

    body.post #wrapper aside #back-to-top {
        font-family: var(--font-ui);
        font-size: var(--text-meta);
        color: var(--color-text-4);
        background: none;
        border: 1px solid var(--color-border);
        border-radius: var(--radius-lg);
    }

    @media (hover: hover) {
        body.post #wrapper aside #back-to-top:hover {
            color: var(--color-brand);
            border-color: var(--color-brand);
        }
    }

    /* ─── prose ────────────────────────────────────────────────────── */

    /* the first block in a region carries no section gap of its own */
    body .prose > :first-child {
        margin-top: 0;
    }

    body .prose h2 {
        font-family: var(--font-serif);
        font-weight: 500;
        font-size: var(--text-h2);
        line-height: 1.25;
        letter-spacing: 0;
        color: var(--color-text);
        margin: 2.2em 0 0.5em;
        overflow-wrap: break-word;
        min-width: 0;
    }

    body .prose h3 {
        font-family: var(--font-serif);
        font-weight: 500;
        font-size: var(--text-h3);
        line-height: 1.3;
        color: var(--color-text);
        margin: 1.9em 0 0.45em;
    }

    body .prose :is(h4, h5, h6) {
        font-family: var(--font-serif);
        font-weight: 500;
        font-size: var(--text-body);
        line-height: 1.35;
        color: var(--color-text);
        margin: 1.7em 0 0.4em;
    }

    /* serif is locked to two weights: 400 body, 500 emphasis */
    body .prose strong {
        font-weight: 500;
    }

    body .prose :is(p, li) {
        line-height: var(--line-height);
    }

    /* body links keep an underline: ink blue against near-black is 1.5:1,
     * below the 3:1 a colour-only affordance needs. Chrome links, where
     * position identifies them, stay underline-free. */
    body .prose a {
        color: var(--color-brand);
        /* Serene draws its own border-bottom on prose links; without this it
         * stacks under the text-decoration and every link renders two rules */
        border-bottom: 0;
        text-decoration: underline;
        text-decoration-color: color-mix(
            in srgb,
            var(--color-brand) 40%,
            transparent
        );
        text-decoration-thickness: 1px;
        text-underline-offset: 3px;
    }

    @media (hover: hover) {
        body .prose a:hover {
            color: var(--color-brand-hover);
            text-decoration-color: currentColor;
        }
    }

    body .prose a:focus-visible {
        color: var(--color-brand-hover);
    }

    /* quote: indentation and olive, no side rule, no italic */
    body .prose blockquote {
        border: 0;
        margin: 1.5em 0 1.5em var(--space-md);
        padding: 0;
        font-style: normal;
        color: var(--color-text-3);
    }

    body .prose hr {
        border: 0;
        height: 1px;
        opacity: 1;
        background: var(--color-border);
        margin: var(--space-xl) 0;
    }

    body .prose li::marker {
        color: var(--color-brand);
    }

    body .prose figcaption {
        font-family: var(--font-ui);
        font-size: var(--text-meta);
        color: var(--color-text-4);
    }

    /* editorial table: hairline rows, no frame, no vertical rules */
    body .prose table {
        display: block;
        overflow-x: auto;
        width: 100%;
        border: 0;
        border-collapse: collapse;
        font-size: var(--text-ui);
    }

    body .prose :is(th, td) {
        border: 0;
        border-bottom: 1px solid var(--color-border-soft);
        padding: 8px 20px 8px 0;
        text-align: left;
        line-height: 1.45;
    }

    body .prose th {
        font-family: var(--font-ui);
        font-size: var(--text-label);
        font-weight: 600;
        letter-spacing: 0.4px;
        text-transform: uppercase;
        color: var(--color-text-4);
        border-bottom: 1px solid var(--color-border);
    }

    body .prose details {
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-lg);
    }

    body .prose mark {
        background: var(--highlight-mark-color);
        color: inherit;
        padding: 0 0.15em;
        border-radius: var(--radius-sm);
    }

    /* inline code is an annotation, not a focal tag */
    body .prose :not(pre) > code {
        color: var(--color-text-2);
        background: var(--color-code-bg);
        border-radius: var(--radius-sm);
        font-size: 0.9em;
        padding: 1px 5px;
    }

    /* ─── code blocks · Kami dark surface, six-token palette ───────── */

    body .prose pre {
        background: var(--code-surface);
        color: var(--code-fg);
        border: 0;
        border-radius: var(--radius-lg);
        font-size: var(--text-small);
        line-height: 1.55;
    }

    body .prose pre.mermaid {
        background: var(--color-surface);
    }

    body .prose pre table tr td:first-of-type {
        color: #5a5750;
    }

    body .prose pre mark::before {
        background: var(--code-mark);
    }

    body .prose .codeblock pre[data-name]::before {
        color: var(--code-faint);
        border-bottom: 1px solid var(--code-rule);
    }

    body .prose .codeblock .copy {
        color: var(--code-faint);
    }

    body .prose .codeblock .copy:is(:hover, .copied) {
        color: var(--code-keyword);
    }

    body .prose pre .z-code,
    body .prose pre .z-variable {
        color: var(--code-fg);
    }

    body .prose pre .z-comment {
        color: var(--code-faint);
        font-style: italic;
    }

    body .prose pre .z-keyword,
    body .prose pre .z-keyword.z-operator,
    body .prose pre .z-keyword.z-operator.z-class,
    body .prose pre .z-meta.z-separator {
        color: var(--code-keyword);
    }

    body .prose pre .z-string,
    body .prose pre .z-markup.z-inserted.z-diff {
        color: var(--code-string);
    }

    body .prose pre .z-constant.z-numeric {
        color: var(--code-number);
    }

    body .prose pre .z-entity.z-name.z-function {
