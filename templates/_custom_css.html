<style>
    /* Hallmark · genre: editorial · macrostructure: Index-First (home · blog) + Long Document (posts · prose) · theme: Newsprint · enrichment: none · nav: N6 masthead · footer: Ft2 inline rule · design-system: design.md · designed-as-app */
    /* Hallmark · pre-emit critique: P5 H4 E4 S4 R5 V4
     * contrast: pass (40–41) · slop: pass (42–45) · honest: pass (46) · chrome: pass (47)
     * tokens: pass (48) · responsive: pass (49) · icons: pass (30) · mobile: pass (34, 49, 50–57) */

    body {
        /* — Newsprint tokens (day edition) — */
        --color-paper: oklch(97.5% 0.005 80);
        --color-paper-2: oklch(94.6% 0.007 80);
        --color-paper-raised: oklch(98.8% 0.005 80);
        --color-ink: oklch(21% 0.012 60);
        --color-ink-2: oklch(44% 0.014 70);
        --color-rule: oklch(85.5% 0.009 80);
        --color-rule-strong: oklch(38% 0.012 70);
        --color-accent: oklch(45% 0.14 25);
        --color-focus: oklch(50% 0.15 25);
        --color-leader: color-mix(in oklab, var(--color-ink-2) 50%, transparent);

        --font-display: "DM Serif Display", ui-serif, Georgia, serif;
        --font-body:
            "Source Serif 4", ui-serif, Georgia, Cambria, "Times New Roman",
            serif;
        --font-mono:
            "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Monaco,
            Consolas, "Liberation Mono", "Courier New", monospace;

        --space-2xs: 0.25rem;
        --space-xs: 0.5rem;
        --space-sm: 0.75rem;
        --space-md: 1rem;
        --space-lg: 1.5rem;
        --space-xl: 2.5rem;
        --space-2xl: 4rem;

        --text-xs: 0.72rem;
        --text-sm: 0.8rem;
        --text-md: 1.2rem;
        --text-lg: 1.5rem;
        --text-display: clamp(2.3rem, 6vw, 3.9rem);

        --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
        --ease-in: cubic-bezier(0.7, 0, 0.84, 0);
        --dur-micro: 120ms;
        --dur-short: 220ms;
        --dur-long: 420ms;
        --rule-hair: 1px;

        /* — Serene theme API, mapped to tokens — */
        --primary-color: var(--color-accent);
        --primary-pale-color: color-mix(
            in oklab,
            var(--color-accent) 26%,
            transparent
        );
        --primary-decoration-color: color-mix(
            in oklab,
            var(--color-accent) 9%,
            transparent
        );
        --bg-color: var(--color-paper);
        --surface-1: var(--color-paper-raised);
        --surface-2: var(--color-paper-2);
        --text-color: var(--color-ink);
        --text-pale-color: var(--color-ink-2);
        --text-decoration-color: var(--color-rule);
        --highlight-mark-color: color-mix(
            in oklab,
            var(--color-accent) 16%,
            transparent
        );

        --callout-note-color: oklch(54% 0.07 160);
        --callout-tip-color: oklch(57% 0.08 145);
        --callout-important-color: oklch(57% 0.11 320);
        --callout-warning-color: oklch(61% 0.12 60);
        --callout-caution-color: oklch(59% 0.14 28);

        --inline-code-bg-color: color-mix(
            in oklab,
            var(--color-ink) 5%,
            var(--color-paper-raised)
        );
        --inline-code-border-radius: 4px;
        --block-code-border-color: var(--color-rule);
        --block-code-border-radius: 8px;
        --detail-border-color: var(--color-rule);
        --detail-border-radius: 8px;

        --main-font: var(--font-body);
        --display-font: var(--font-display);
        --code-font: var(--font-mono);
        --homepage-max-width: 720px;
        --main-max-width: 700px;
        --avatar-size: 60px;
        --font-size: 18px;
        --line-height: 1.72;
        --img-border-radius: 6px;
        --dark-mode-img-brightness: 0.88;
        --dark-mode-chart-brightness: 0.92;

        font-kerning: normal;
        font-optical-sizing: auto;
        font-feature-settings: "liga", "kern", "calt";
    }

    body.dark {
        /* — night edition: same hues, lightness/chroma only — */
        --color-paper: oklch(17% 0.01 70);
        --color-paper-2: oklch(21% 0.012 72);
        --color-paper-raised: oklch(23% 0.012 72);
        --color-ink: oklch(92% 0.008 80);
        --color-ink-2: oklch(71% 0.012 78);
        --color-rule: oklch(33% 0.012 75);
        --color-rule-strong: oklch(76% 0.01 78);
        --color-accent: oklch(64% 0.12 27);
        --color-focus: oklch(68% 0.13 27);

        --callout-note-color: oklch(74% 0.07 160);
        --callout-tip-color: oklch(77% 0.08 145);
        --callout-important-color: oklch(76% 0.09 320);
        --callout-warning-color: oklch(78% 0.11 64);
        --callout-caution-color: oklch(72% 0.12 28);

        --inline-code-bg-color: color-mix(
            in oklab,
            var(--color-ink) 6%,
            var(--color-paper-raised)
        );
        --primary-pale-color: color-mix(
            in oklab,
            var(--color-accent) 32%,
            transparent
        );
        --primary-decoration-color: color-mix(
            in oklab,
            var(--color-accent) 12%,
            transparent
        );
        --highlight-mark-color: color-mix(
            in oklab,
            var(--color-accent) 22%,
            transparent
        );
    }

    html {
        scroll-behavior: smooth;
        overflow-x: clip;
    }

    body {
        overflow-x: clip;
        accent-color: var(--color-accent);
    }

    body.dark .prose :is(p, li, blockquote, td) {
        font-weight: 380;
    }

    body ::selection {
        color: var(--color-paper);
        background: var(--color-accent);
    }

    body :is(a, button) {
        transition:
            color var(--dur-micro) var(--ease-out),
            background-color var(--dur-micro) var(--ease-out),
            border-color var(--dur-micro) var(--ease-out),
            text-decoration-color var(--dur-micro) var(--ease-out),
            text-decoration-thickness var(--dur-micro) var(--ease-out);
    }

    body :is(a, button):focus-visible {
        outline: 2px solid var(--color-focus);
        outline-offset: 3px;
    }

    body :is(a, button):active {
        color: var(--color-accent);
    }

    body button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
    }

    /* — interior-page header: the back link as a small-caps folio line — */
    body header a {
        color: var(--color-ink-2);
        text-transform: uppercase;
        letter-spacing: 0.12em;
        font-size: var(--text-xs);
        white-space: nowrap;
    }

    body header a:hover,
    body header a:focus-visible {
        color: var(--color-accent);
    }

    /* — section title: display serif over a double rule — */
    body .section-title {
        margin-top: var(--space-md);
        border-bottom: 4px double var(--color-rule-strong);
        padding-bottom: var(--space-sm);
    }

    body .section-title h1 {
        font-family: var(--font-display);
        font-weight: 400;
        font-size: clamp(2rem, 5vw, 3.1rem);
        line-height: 1.06;
        letter-spacing: -0.01em;
        margin: 0.75rem 0 0.3rem;
        text-wrap: balance;
        overflow-wrap: anywhere;
        min-width: 0;
    }

    body .section-title p {
        max-width: none;
        width: 100%;
        font-size: 1rem;
        line-height: 1.6;
        color: var(--color-ink-2);
    }

    /* — homepage: N6 masthead — */
    body.homepage #wrapper {
        padding: 0 0 var(--space-lg);
    }

    body.homepage #wrapper main {
        min-height: auto;
        padding: clamp(2.75rem, 7vh, 4.75rem) 0 var(--space-lg);
    }

    body.homepage #wrapper #info {
        flex-direction: column;
        align-items: center;
        gap: var(--space-md);
        text-align: center;
        padding-bottom: var(--space-lg);
        border-bottom: 4px double var(--color-rule-strong);
    }

    body.homepage #wrapper #info img {
        height: var(--avatar-size);
        width: var(--avatar-size);
        border-radius: 4px;
        border: var(--rule-hair) solid var(--color-rule-strong);
        padding: 2px;
        background: var(--color-paper-raised);
        object-fit: cover;
        filter: grayscale(1) contrast(1.04);
        box-shadow: none;
    }

    body.homepage #wrapper #info #text {
        align-items: center;
        gap: var(--space-xs);
    }

    body.homepage #wrapper #info #text > div:first-child {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: var(--space-2xs);
    }

    body.homepage #wrapper #name {
        font-family: var(--font-display);
        font-weight: 400;
        font-size: var(--text-display);
        line-height: 1.05;
        text-transform: uppercase;
        letter-spacing: 0.015em;
        text-wrap: balance;
        overflow-wrap: anywhere;
        min-width: 0;
    }

    body.homepage #wrapper #id {
        margin-left: 0;
        font-family: var(--font-mono);
        font-size: var(--text-sm);
        letter-spacing: 0.04em;
        color: var(--color-ink-2);
    }

    body.homepage #wrapper #bio {
        color: var(--color-ink-2);
        text-transform: uppercase;
        letter-spacing: 0.1em;
        font-size: var(--text-xs);
        line-height: 1.9;
        max-width: 56ch;
    }

    /* — masthead link row — */
    body.homepage #wrapper #links {
        justify-content: center;
        flex-wrap: wrap;
        row-gap: var(--space-sm);
        column-gap: var(--space-xl);
        padding: var(--space-sm) 0;
        border-bottom: var(--rule-hair) solid var(--color-rule-strong);
        margin-bottom: var(--space-lg);
    }

    body.homepage #wrapper #links #left {
        gap: var(--space-lg);
        flex-wrap: wrap;
        justify-content: center;
    }

    body.homepage #wrapper #links #left a {
        color: var(--color-ink);
        text-transform: uppercase;
        letter-spacing: 0.12em;
        font-size: var(--text-xs);
        text-decoration: none;
        white-space: nowrap;
    }

    body.homepage #wrapper #links #left a:hover,
    body.homepage #wrapper #links #left a:focus-visible {
        color: var(--color-accent);
    }

    body.homepage #wrapper #links #right {
        gap: var(--space-sm);
    }

    body.homepage #wrapper #links #right :is(a, button) {
        color: var(--color-ink-2);
    }

    body.homepage #wrapper #links #right :is(a, button):hover,
    body.homepage #wrapper #links #right :is(a, button):focus-visible {
        color: var(--color-accent);
        background: none;
    }

    /* — the brief, set as a letter — */
    body.homepage #wrapper #brief {
        max-width: 62ch;
    }

    body.homepage #wrapper #brief p {
        line-height: var(--line-height);
    }

    body.homepage #wrapper #brief p:first-of-type {
        font-family: var(--font-display);
        font-weight: 400;
        font-size: var(--text-lg);
        line-height: 1.3;
    }

    /* — the writing index: dotted leaders, mono dates — */
    body.homepage #wrapper .layout-list .post-list::before {
        content: "Recent writing";
        display: block;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        font-size: var(--text-xs);
        color: var(--color-ink-2);
        border-top: var(--rule-hair) solid var(--color-rule-strong);
        padding-top: var(--space-sm);
        margin-bottom: var(--space-xs);
    }

    body .layout-list .category {
        text-transform: uppercase;
        letter-spacing: 0.12em;
        font-size: var(--text-xs);
        color: var(--color-ink-2);
        border-top: var(--rule-hair) solid var(--color-rule-strong);
        padding-top: var(--space-sm);
        margin: 2.25em 15px 0.5em;
    }

    body .layout-list .post {
        align-items: baseline;
        gap: var(--space-sm);
        padding: 0.5em 0;
        text-decoration: none;
    }

    body .layout-list .post span:first-child {
        order: 1;
        font-weight: 600;
        font-size: 1.02rem;
        color: var(--color-ink);
    }

    body .layout-list .post::before {
        content: "";
        order: 2;
        flex: 1 1 auto;
        min-width: 2ch;
        height: 0.72em;
        border-bottom: var(--rule-hair) dotted var(--color-leader);
    }

    body .layout-list .post .date {
        order: 3;
        font-family: var(--font-mono);
        font-variant-numeric: tabular-nums;
        font-size: var(--text-sm);
        color: var(--color-ink-2);
        white-space: nowrap;
    }

    body .layout-list .post:hover span:first-child,
    body .layout-list .post:focus-visible span:first-child {
        color: var(--color-accent);
    }

    body .layout-list .post.featured span:first-child::after {
        content: " ★" / "";
        color: var(--color-accent);
        font-size: 0.72em;
    }

    body .layout-list .read-more {
        margin-top: var(--space-sm);
    }

    body .layout-list .read-more a {
        text-transform: uppercase;
        letter-spacing: 0.12em;
        font-size: var(--text-xs);
        color: var(--color-ink-2);
        text-decoration: none;
        white-space: nowrap;
    }

    body .layout-list .read-more a:hover,
    body .layout-list .read-more a:focus-visible {
        color: var(--color-accent);
    }

    /* — post page: Long Document — */
    body.post #wrapper main article.prose > h1 {
        font-family: var(--font-display);
        font-weight: 400;
        font-size: clamp(1.9rem, 4.5vw, 2.75rem);
        line-height: 1.12;
        letter-spacing: -0.01em;
        text-wrap: balance;
        overflow-wrap: anywhere;
        min-width: 0;
    }

    body.post #wrapper main article #post-info {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        justify-content: space-between;
        gap: var(--space-xs) var(--space-md);
        border-bottom: var(--rule-hair) solid var(--color-rule-strong);
        padding-bottom: var(--space-sm);
        margin-bottom: var(--space-lg);
    }

    body.post #wrapper main article #date {
        font-family: var(--font-mono);
        font-variant-numeric: tabular-nums;
        font-size: var(--text-xs);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--color-ink-2);
    }

    body.post #wrapper main article #tags {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-sm);
    }

    body.post #wrapper main article #tags a {
        font-family: var(--font-mono);
        font-size: var(--text-xs);
        color: var(--color-ink-2);
        text-decoration: none;
        white-space: nowrap;
    }

    body.post #wrapper main article #tags a span {
        color: var(--color-accent);
    }

    body.post #wrapper main article #tags a:hover,
    body.post #wrapper main article #tags a:focus-visible {
        color: var(--color-accent);
    }

    /* — table of contents: marginal, quiet — */
    body.post #wrapper aside nav {
        border-inline-start: var(--rule-hair) solid var(--color-rule);
        padding-inline-start: var(--space-md);
        font-size: 0.8rem;
        line-height: 1.6;
    }

    body.post #wrapper aside a {
        color: var(--color-ink-2);
        text-decoration: none;
    }

    body.post #wrapper aside a:hover,
    body.post #wrapper aside a:focus-visible {
        color: var(--color-accent);
    }

    body.post #wrapper aside #back-to-top {
        color: var(--color-ink-2);
        border: var(--rule-hair) solid var(--color-rule);
        border-radius: 4px;
        background: var(--color-paper-raised);
    }

    body.post #wrapper aside #back-to-top:hover,
    body.post #wrapper aside #back-to-top:focus-visible {
        color: var(--color-accent);
        border-color: var(--color-rule-strong);
    }

    /* — prose: the reading voice — */
    body .prose h2 {
        font-family: var(--font-display);
        font-weight: 400;
        font-size: 1.6rem;
        line-height: 1.2;
        letter-spacing: -0.005em;
        margin: 2.4em 0 0.7em;
        overflow-wrap: anywhere;
        min-width: 0;
    }

    body .prose h3 {
        font-family: var(--font-body);
        font-weight: 700;
        font-size: 1.2rem;
        line-height: 1.3;
        margin: 2em 0 0.6em;
    }

    body .prose h4,
    body .prose h5,
    body .prose h6 {
        font-family: var(--font-body);
        font-weight: 700;
        font-size: 1.02rem;
        margin: 1.8em 0 0.5em;
    }

    body .prose p,
    body .prose li {
        line-height: var(--line-height);
    }

    body .prose a {
        color: inherit;
        text-decoration: underline;
        text-decoration-color: var(--color-accent);
        text-decoration-thickness: 1px;
        text-underline-offset: 3px;
    }

    body .prose a:hover,
    body .prose a:focus-visible {
        color: var(--color-accent);
        text-decoration-thickness: 2px;
    }

    body .prose blockquote {
        border-inline-start: var(--rule-hair) solid var(--color-rule-strong);
        padding-inline-start: var(--space-lg);
        margin-inline-start: 0;
        font-style: italic;
        color: var(--color-ink);
    }

    body .prose hr {
        border: 0;
        margin: 2.6em auto;
        text-align: center;
    }

    body .prose hr::before {
        content: "❦" / "";
        display: block;
        color: var(--color-ink-2);
        font-size: 1.1rem;
        line-height: 1;
    }

    body .prose :not(pre) > code {
        background: var(--inline-code-bg-color);
        border-radius: var(--inline-code-border-radius);
        font-size: 0.85em;
    }

    body .prose pre {
        border: var(--rule-hair) solid var(--block-code-border-color);
        border-radius: var(--block-code-border-radius);
    }

    body .prose table {
        display: block;
        overflow-x: auto;
        border-collapse: collapse;
    }

    body .prose th,
    body .prose td {
        border-bottom: var(--rule-hair) solid var(--color-rule);
        padding: 0.5em 0.9em 0.5em 0;
        text-align: left;
    }

    body .prose th {
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-size: var(--text-xs);
        font-weight: 600;
        color: var(--color-ink-2);
        border-bottom-color: var(--color-rule-strong);
    }

    body .prose td {
        font-variant-numeric: tabular-nums;
    }

    body .prose details {
        border: var(--rule-hair) solid var(--detail-border-color);
        border-radius: var(--detail-border-radius);
    }

    body .prose mark {
        background: var(--highlight-mark-color);
        color: inherit;
        padding: 0 0.15em;
    }

    /* — footer: Ft2 inline rule, single line — */
    body footer {
        align-items: center;
        border-top: var(--rule-hair) solid var(--color-rule-strong);
        margin-top: var(--space-2xl);
        padding-top: var(--space-sm);
        font-size: var(--text-xs);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--color-ink-2);
    }

    body footer .left a,
    body footer .right a {
        color: var(--color-ink-2);
        text-decoration: none;
        white-space: nowrap;
    }

    body footer .left a:hover,
    body footer .right a:hover,
    body footer .left a:focus-visible,
    body footer .right a:focus-visible {
        color: var(--color-accent);
    }

    body footer .right #theme-toggle {
        color: var(--color-ink-2);
        border: var(--rule-hair) solid var(--color-rule);
        border-radius: 4px;
        background: none;
    }

    body footer .right #theme-toggle:hover,
    body footer .right #theme-toggle:focus-visible {
        color: var(--color-accent);
        border-color: var(--color-rule-strong);
        background: none;
    }

    /* — one orchestrated entrance; nothing animates on scroll — */
    @keyframes rise-in {
        from {
            opacity: 0;
            transform: translateY(8px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @media (prefers-reduced-motion: no-preference) {
        body.homepage #wrapper #info,
        body.homepage #wrapper #links,
        body.homepage #wrapper #brief,
        body.homepage #wrapper .layout-list,
        body.blog #wrapper .section-title,
        body.blog #wrapper main,
        body.post #wrapper main article,
        body.post #wrapper main footer {
            animation: rise-in var(--dur-long) var(--ease-out) both;
        }

        body.homepage #wrapper #links {
            animation-delay: 60ms;
        }

        body.homepage #wrapper #brief {
            animation-delay: 120ms;
        }

        body.homepage #wrapper .layout-list,
        body.blog #wrapper main,
        body.post #wrapper main footer {
            animation-delay: 180ms;
        }
    }

    /* — responsive (theme breakpoints) — */
    @media (max-width: 768px) {
        body {
            --font-size: 17px;
            --avatar-size: 56px;
            --homepage-max-width: calc(100vw - 32px);
            --main-max-width: calc(100vw - 32px);
        }

        body.homepage #wrapper #name,
        body.post #wrapper main article.prose > h1 {
            max-width: none;
        }
    }

    @media (max-width: 425px) {
        body.homepage #wrapper #links #left {
            column-gap: var(--space-md);
        }

        body .layout-list .post {
            flex-direction: column;
            align-items: flex-start;
            gap: 0.15rem;
        }

        body .layout-list .post::before {
            display: none;
        }
    }

    @media (prefers-reduced-motion: reduce) {
        html {
            scroll-behavior: auto;
        }
    }
</style>
